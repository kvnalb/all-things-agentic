[project]
name = "studyagent"
version = "0.1.0"
description = "A source-linked academic calendar agent."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "google-adk>=1,<2",
  "google-api-python-client>=2.170,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-cloud-firestore>=2.20,<3",
  "google-cloud-secret-manager>=2.24,<3",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/studyagent"]

[tool.uv]
package = true
