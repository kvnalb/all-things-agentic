[project]
name = "studyagent"
version = "0.1.0"
description = "A source-linked academic calendar agent."
requires-python = ">=3.12,<3.13"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.116,<1",
  "google-adk>=2,<3",
  "google-api-python-client>=2.180,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-cloud-firestore>=2.21,<3",
  "google-cloud-secret-manager>=2.24,<3",
  "google-cloud-storage>=3.4,<4",
  "httpx>=0.28,<1",
  "requests>=2.32,<3",
  "pydantic>=2.11,<3",
  "pypdf>=6.1,<7",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/studyagent"]

[tool.uv]
package = true
