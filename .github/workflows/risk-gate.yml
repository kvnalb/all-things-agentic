name: Risk gate

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  risk-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check decision disclosure and conditional approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_pr_gate.py
