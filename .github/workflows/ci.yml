name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: pip install uv
      - run: corepack enable
      - run: corepack install --global pnpm@11.18.0
      - run: uv sync --frozen
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: make check
