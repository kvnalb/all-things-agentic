language: en-US
tone_instructions: Be concise and direct. Report only actionable, non-trivial findings.

reviews:
  profile: quiet
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  related_issues: false
  related_prs: false
  poem: false
  suggested_labels: true
  auto_apply_labels: true
  mutually_exclusive_groups:
    risk:
      - low-risk
      - needs-human-review
  labeling_instructions:
    - label: needs-human-review
      instructions: >-
        Apply only when the implementation drifts from the linked issue, PRD,
        acceptance criteria, or explicit intent; or when the diff implies a
        material decision, deviation, assumption, or suggestion that is missing
        from the PR's Decisions and deviations section. Do not apply solely
        because a fully disclosed change touches security, data, infrastructure,
        dependencies, external actions, or demo behavior.
    - label: low-risk
      instructions: >-
        Apply when the implementation matches the stated intent and every
        material decision, deviation, assumption, and suggestion is disclosed
        in the PR, regardless of which technical area the change touches.
  path_instructions:
    - path: "**/*"
      instructions: >-
        Apply AGENTS.md. Check the diff against the linked issue, PRD, acceptance
        criteria, and the PR's Decisions and deviations section. Escalate to a
        human only for intent drift or an undisclosed material decision. Continue
        to report concrete correctness or security defects, but do not use them
        alone to demand human review when intent and decisions are clear. Ignore
        subjective style, naming, formatting, and speculative improvements.
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    base_branches:
      - ".*"

knowledge_base:
  code_guidelines:
    enabled: true
